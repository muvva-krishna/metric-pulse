version: 2

models:
  - name: stg_users
    description: "Cleaned user accounts and plan tiers"
    meta:
      grain: user_id
      primary_key: user_id
      freshness_sla_hours: 4
      date_col: created_at
      ingested_col: ingested_at
      critical_non_null_cols: ["user_id", "account_id"]

  - name: stg_orders
    description: "Cleaned order transactions"
    meta:
      grain: order_id
      primary_key: order_id
      partition_col: order_date
      freshness_sla_hours: 4
      date_col: order_date
      ingested_col: ingested_at
      critical_non_null_cols: ["order_id", "account_id", "net_revenue_usd"]

  - name: stg_order_items
    description: "Line items per order (1:N with orders)"
    meta:
      grain: order_item_id
      primary_key: order_item_id
      freshness_sla_hours: 4
      ingested_col: ingested_at
      critical_non_null_cols: ["order_item_id", "order_id"]

  - name: stg_payments
    description: "Payment gateway captures per order"
    meta:
      grain: payment_id
      primary_key: payment_id
      freshness_sla_hours: 4
      ingested_col: ingested_at
      critical_non_null_cols: ["payment_id", "order_id"]

  - name: stg_support_tickets
    description: "Customer support tickets (N per account)"
    meta:
      grain: ticket_id
      primary_key: ticket_id
      partition_col: created_date
      freshness_sla_hours: 4
      date_col: created_date
      ingested_col: ingested_at
      critical_non_null_cols: ["ticket_id", "account_id"]

  - name: stg_telemetry_eu
    description: "Enterprise product telemetry stream"
    meta:
      grain: event_id
      primary_key: event_id
      partition_col: event_date
      freshness_sla_hours: 4
      date_col: event_date
      ingested_col: ingested_at
      critical_non_null_cols: ["event_id", "user_id", "session_id"]

  - name: stg_checkout_events
    description: "Checkout funnel events across regions, devices, and payment gateways"
    meta:
      grain: checkout_session_id
      primary_key: checkout_session_id
      partition_col: event_date
      freshness_sla_hours: 4
      date_col: event_date
      ingested_col: ingested_at
      critical_non_null_cols: ["checkout_session_id", "user_id"]

  - name: stg_trials
    description: "Trial signups and paid conversion outcomes"
    meta:
      grain: trial_id
      primary_key: trial_id
      partition_col: trial_date
      freshness_sla_hours: 4
      date_col: trial_date
      ingested_col: ingested_at
      critical_non_null_cols: ["trial_id", "user_id"]
